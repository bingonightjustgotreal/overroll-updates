name: Publish Roundiness Windows updates

on:
  push:
    branches: [main]
    paths:
      - 'main.js'
      - 'preload.js'
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'package.json'
      - 'package-lock.json'
      - 'build/**'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Set a unique release version
        shell: pwsh
        run: npm version "1.1.$env:GITHUB_RUN_NUMBER" --no-git-tag-version
      - name: Build and publish the Windows installer and updater manifest
        run: npm run release:win
